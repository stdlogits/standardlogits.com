<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Standard Logits social card</title>
<!-- The social card, 1200 × 630 (drawn at 2×), as Ledger draws one (its DESIGN.md, "The marks and the cards"): a
     painting with the name set over it. scripts/site/render.mjs paints it (scripts/site/paint/river.py: the logit
     curve as a river at dusk, what Qwen3-8B-Base expected after "Standard" floating down it as lanterns) and
     calls draw() with the painting and where its lanterns float. The type is Ledger's card.css: the name with
     ·Log marked, and the likeliest token and ·Log read out at their lanterns. No sentences. -->
<link rel="stylesheet" href="../../node_modules/@stdlogits/ledger/src/styles/card.css" />
<style>
  body { --tint: color-mix(in oklch, var(--deep) 70%, var(--late)); }
  .card { justify-content: flex-start; }
  /* The name is the line here, so it is set larger, its token marked as the hero marks it. */
  .name { font-size: 100px; letter-spacing: -0.04em; }
  .name mark { border-radius: 12px; color: var(--ink); background: color-mix(in oklch, var(--tint) 38%, transparent); box-shadow: 0 0 0 6px color-mix(in oklch, var(--tint) 38%, transparent); }
</style>
</head>
<body>
<img class="art" id="art" alt="" />
<div id="readouts"></div>
<main class="card">
  <h1 class="name" id="name"></h1>
</main>
<script>
  // The same formatting as src/lib/odds.ts.
  const count = (n) => n.toLocaleString("en-US");
  const percent = (p) => { const v = p * 100; return `${v >= 1 ? v.toFixed(1) : Number(v.toPrecision(2))}%`; };
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const tok = (t, marked) => `<span class="tok${marked ? " marked" : ""}">${t.startsWith(" ") ? '<span class="ws">·</span>' : ""}${esc(t.trim())}</span>`;

  // art: the painting's URL; standard: src/lib/standard.json; lanterns: where each token floats (river.py),
  // the name's own token with `name` set.
  window.draw = async ({ art, standard, lanterns }) => {
    const [log, its] = standard.name.pieces;
    document.getElementById("name").innerHTML = `${esc(standard.prompt)} <mark>${esc(log.token.trim())}</mark>${esc(its.token)}`;
    // Two readouts: the likeliest token beside its lantern at the river's mouth, and the name's under its own.
    document.getElementById("readouts").innerHTML = lanterns.filter((c) => c.rank === 1 || c.name).map((c) => {
      const [x, y] = c.name ? [c.xy[0] - 6, c.xy[1] + 64] : [c.xy[0] + 34, c.xy[1]];
      const value = c.name ? `rank ${count(c.rank)} · <b>${percent(c.p)}</b>` : `<b>${percent(c.p)}</b>`;
      return `<div class="at" style="left: ${x}px; top: ${y}px">${tok(c.token, c.name)}<span class="value">${value}</span></div>`;
    }).join("");
    const image = document.getElementById("art");
    image.src = art;
    await image.decode();
  };
</script>
</body>
</html>
